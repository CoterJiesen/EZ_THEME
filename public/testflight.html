<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="./images/logo.png">
  <title>TestFlight 下载 - 达世界</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #355cc2;
      --primary-hover: #2d4eaa;
      --text: #333;
      --text-light: #666;
      --bg: #fff;
      --section-bg: #f5f5f7;
      --card-bg: #fff;
      --border: rgba(0, 0, 0, 0.08);
    }

    :root[data-theme="dark"] {
      --text: #f5f5f7;
      --text-light: #a1a1a6;
      --bg: #1a1a1a;
      --section-bg: #0f0f0f;
      --card-bg: #1f1f1f;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 5%;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
    }

    .logo img {
      height: 30px;
      border-radius: 8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-toggle:hover {
      background-color: var(--section-bg);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }

    .back-link {
      font-size: 15px;
      font-weight: 500;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 5%;
    }

    .card {
      max-width: 640px;
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
    }

    .card h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
    }

    .lead {
      color: var(--text-light);
      text-align: center;
      margin-bottom: 24px;
    }

    .notice {
      background-color: rgba(53, 92, 194, 0.08);
      border: 1px solid rgba(53, 92, 194, 0.2);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 32px;
      line-height: 1.7;
    }

    .notice strong {
      color: var(--primary);
    }

    .step {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }

    .step-num {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--primary);
      color: #fff;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step-body {
      flex: 1;
    }

    .step-body h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .step-body p {
      color: var(--text-light);
      font-size: 14px;
      margin-bottom: 14px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 24px;
      font-weight: 500;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.3s ease;
      text-align: center;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-outline {
      color: var(--primary);
      border: 1px solid var(--primary);
      background: transparent;
    }

    .btn-outline:hover {
      background-color: rgba(53, 92, 194, 0.08);
      transform: translateY(-2px);
    }

    footer {
      padding: 32px 5%;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 16px;
    }

    .footer-links a {
      color: var(--text-light);
      font-size: 14px;
    }

    .footer-links a:hover {
      color: var(--primary);
    }

    .copyright {
      color: var(--text-light);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 32px 22px;
      }
      .card h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="./">
      <img src="./images/logo.png" alt="Logo">
      <span id="siteName">达世界</span>
    </a>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9a9 9 0 1 1 -9 -9z"></path>
        </svg>
      </button>
      <a class="back-link" href="./">返回官网</a>
    </div>
  </header>

  <main>
    <div class="card">
      <h1>TestFlight 安装 iOS 客户端</h1>
      <!-- <p class="lead">由于政策原因，<span id="siteNameLead">达世界</span> iOS 客户端暂时无法在中国区 App Store 中下载，请您通过 TestFlight 进行安装。</p> -->

      <div class="notice">
        <strong>提示：</strong>iOS 客户端内未提供会员购买渠道，会员购买请在官网登录账号后进行购买操作。
      </div>

      <div class="step">
        <div class="step-num">1</div>
        <div class="step-body">
          <h2>第一步：在 App Store 中下载 TestFlight</h2>
          <p>若您已安装 TestFlight，可跳过此步。</p>
          <a class="btn btn-outline" href="https://apps.apple.com/app/testflight/id899247664" target="_blank" rel="noopener noreferrer">点击下载 TestFlight</a>
        </div>
      </div>

      <div class="step">
        <div class="step-num">2</div>
        <div class="step-body">
          <h2>第二步：点击下方安装客户端</h2>
          <p>点击按钮将跳转到 TestFlight 并安装客户端。</p>
          <a class="btn btn-primary" id="joinBtn" href="#" target="_blank" rel="noopener noreferrer">点击下载安装</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="./">返回官网</a>
      <a href="./privacy_zh.html">隐私政策</a>
    </div>
    <p class="copyright" id="copyrightText">© 2025 达世界. All Rights Reserved.</p>
  </footer>

  <script>
    <!-- var TESTFLIGHT_JOIN_URL = 'https://testflight.apple.com/join/XbmAsUWT'; -->
    var TESTFLIGHT_JOIN_URL = 'itms-beta://testflight.apple.com/join/XbmAsUWT';
    
    var THEME_STORAGE_KEY = 'theme-preference';

    // 主题：优先读取站点已有的主题偏好，否则跟随系统
    (function () {
      var saved = localStorage.getItem(THEME_STORAGE_KEY);
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();

    // 主题切换按钮
    (function () {
      var html = document.documentElement;
      var btn = document.getElementById('themeToggle');
      btn.addEventListener('click', function () {
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem(THEME_STORAGE_KEY, next);
      });
    })();

    // 读取站点配置（若存在），覆盖站点名称 / 版权 / 主色 / TestFlight 链接
    (function () {
      var cfg = window.EZ_CONFIG;

      if (cfg && cfg.SITE_CONFIG && cfg.SITE_CONFIG.siteName) {
        document.getElementById('siteName').textContent = cfg.SITE_CONFIG.siteName;
        document.getElementById('siteNameLead').textContent = cfg.SITE_CONFIG.siteName;
        document.title = 'TestFlight 下载 - ' + cfg.SITE_CONFIG.siteName;
      }

      if (cfg && cfg.SITE_CONFIG && cfg.SITE_CONFIG.copyright) {
        document.getElementById('copyrightText').textContent = cfg.SITE_CONFIG.copyright;
      }

      if (cfg && cfg.DEFAULT_CONFIG && cfg.DEFAULT_CONFIG.primaryColor) {
        var color = cfg.DEFAULT_CONFIG.primaryColor;
        document.documentElement.style.setProperty('--primary', color);

        var r = parseInt(color.substring(1, 3), 16);
        var g = parseInt(color.substring(3, 5), 16);
        var b = parseInt(color.substring(5, 7), 16);
        var hoverR = Math.max(0, r - 15), hoverG = Math.max(0, g - 15), hoverB = Math.max(0, b - 15);
        document.documentElement.style.setProperty(
          '--primary-hover',
          '#' + hoverR.toString(16).padStart(2, '0') + hoverG.toString(16).padStart(2, '0') + hoverB.toString(16).padStart(2, '0')
        );
      }

      if (cfg && cfg.CLIENT_CONFIG && cfg.CLIENT_CONFIG.testflight && cfg.CLIENT_CONFIG.testflight.testFlightJoinUrl) {
        TESTFLIGHT_JOIN_URL = cfg.CLIENT_CONFIG.testflight.testFlightJoinUrl;
      }

      document.getElementById('joinBtn').href = TESTFLIGHT_JOIN_URL;
    })();
  </script>
</body>
</html>
